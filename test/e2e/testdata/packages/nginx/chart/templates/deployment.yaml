apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: {{ .Release.Namespace }}
  labels:
    app: nginx-test
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
