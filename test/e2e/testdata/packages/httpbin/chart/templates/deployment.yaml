apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: {{ .Release.Namespace }}
  labels:
    app: httpbin
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
