kind: ZarfPackageConfig
metadata:
  name: e2e-test-httpbin
  description: Httpbin package for e2e testing package variables (spec.set)
  version: 0.0.1
  yolo: true

variables:
  - name: REPLICAS
    default: "1"
    description: Number of httpbin replicas
  - name: SERVICE_PORT
    default: "8080"
    description: Httpbin service port

components:
  - name: httpbin
    required: true
    charts:
      - name: httpbin
        namespace: e2e-test-httpbin
        version: 0.0.1
        localPath: chart
        valuesFiles:
          - httpbin-values.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: deployment
                name: httpbin
                namespace: e2e-test-httpbin
                condition: available
