# Auth-protected OCI registry for e2e testing registryCredentialSecretRef.
# Credentials: testuser / testpass (htpasswd Secret created by Makefile e2e-setup).
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-registry-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-auth
  namespace: e2e-registry-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-auth
  template:
    metadata:
      labels:
        app: registry-auth
    spec:
      # Prevent K8s from injecting REGISTRY_AUTH_* service env vars that
      # collide with the registry:2 image's env-based config parser.
      enableServiceLinks: false
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: "htpasswd"
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "Registry Realm"
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: "/auth/htpasswd"
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: auth
          secret:
            secretName: registry-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry-auth
  namespace: e2e-registry-auth
spec:
  type: NodePort
  selector:
    app: registry-auth
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30501
