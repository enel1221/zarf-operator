---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - zarf.dev
  resources:
  - zarfpackages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - zarf.dev
  resources:
  - zarfpackages/finalizers
  verbs:
  - update
- apiGroups:
  - zarf.dev
  resources:
  - zarfpackages/status
  verbs:
  - get
  - patch
  - update
