---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: zarfpackages.zarf.dev
spec:
  group: zarf.dev
  names:
    categories:
    - zarf
    kind: ZarfPackage
    listKind: ZarfPackageList
    plural: zarfpackages
    shortNames:
    - zp
    singular: zarfpackage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.deployedVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ZarfPackage is the Schema for the zarfpackages API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZarfPackageSpec defines the desired state of ZarfPackage.
            properties:
              adoptExistingResources:
                description: AdoptExistingResources indicates whether to adopt any
                  pre-existing K8s resources into the Helm charts managed by Zarf.
                type: boolean
              architecture:
                description: Architecture is the target architecture for the Zarf
                  package.
                type: string
              clusterSecretRef:
                description: |-
                  ClusterSecretRef is the name of a Secret in the same namespace as the
                  ZarfPackage that provides credentials for deploying to a remote
                  Kubernetes cluster. When omitted, the package is deployed to the cluster
                  the operator is running in (default behavior).

                  Two Secret shapes are supported, keyed on the "config" entry:
                    - vcluster-style: "config" contains a full kubeconfig YAML document.
                    - Argo CD cluster-secret style: "config" contains a JSON object with a
                      "tlsClientConfig" (caData/certData/keyData) or "bearerToken", paired
                      with sibling "server" and (optionally) "name" keys.

                  Changing, setting, or clearing this field triggers a redeploy. The
                  operator does NOT uninstall the previous deployment when the target
                  cluster changes; any resources on the old cluster are orphaned and must
                  be cleaned up out-of-band.
                type: string
              components:
                description: Components is a list of components to deploy. Adding
                  this field will skip the prompts for selected components.
                items:
                  type: string
                type: array
              dependsOn:
                description: DependsOn specifies ZarfPackages that must be in Deployed
                  phase before this package deploys.
                items:
                  description: DependsOnReference references another ZarfPackage that
                    must be deployed first.
                  properties:
                    name:
                      description: Name of the ZarfPackage dependency.
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the dependency. Defaults to the same
                        namespace as this package when omitted.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              features:
                description: Features is a list of features to enable in the Zarf
                  package.
                items:
                  type: string
                type: array
              helmDebugEnabled:
                default: false
                description: HelmDebugEnabled forces Helm debug logs to be captured
                  for this package deployment.
                type: boolean
              initOptions:
                description: |-
                  InitOptions configures init-package-specific deployment parameters.
                  Silently ignored by zarf for non-init packages. Changes here trigger a
                  redeploy.
                properties:
                  registryInfo:
                    description: RegistryInfo configures the target cluster's zarf
                      registry.
                    properties:
                      address:
                        description: |-
                          Address overrides the registry address recorded in the referenced
                          zarf-state secret (registryInfo.address). Use this when the secret's
                          address is not reachable from the target cluster — for example, when
                          initializing a vcluster that pulls from a host-cluster registry exposed
                          via service replication, the zarf-state secret on the host records an
                          address like "127.0.0.1:31999" which does not resolve from the vcluster.
                        type: string
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef is the name of a Secret in the same namespace as
                          the ZarfPackage that matches the shape zarf itself writes under
                          zarf/zarf-state. The controller parses the Secret's ".data.state" JSON
                          payload and extracts "registryInfo" (address, nodePort, secret,
                          pushUsername, pushPassword, pullUsername, pullPassword). Users can sync
                          the source cluster's zarf-state secret into the ZarfPackage's namespace
                          rather than authoring a custom secret.
                        type: string
                      nodePort:
                        description: |-
                          NodePort overrides the registry NodePort recorded in the referenced
                          zarf-state secret (registryInfo.nodePort). Only meaningful when zarf's
                          internal registry is deployed; ignored once an external Address is set.
                        format: int32
                        type: integer
                    type: object
                type: object
              insecureSkipTLSVerify:
                description: InsecureSkipTLSVerify indicates whether to skip TLS verification
                  for the Zarf package.
                type: boolean
              key:
                description: Key is the key used for authentication with the Zarf
                  package.
                type: string
              logFormat:
                description: LogFormat is the format of the logs for the Zarf package.
                type: string
              logLevel:
                description: LogLevel is the level of logging for the Zarf package.
                type: string
              maxRetries:
                default: 0
                description: |-
                  MaxRetries is the maximum number of consecutive failures before permanently marking
                  the package as Failed. 0 means unlimited retries.
                format: int32
                type: integer
              namespace:
                description: Namespace is the Kubernetes namespace to deploy the Zarf
                  package into.
                type: string
              noColor:
                description: NoColor indicates whether to disable colored output in
                  logs.
                type: boolean
              ociConcurrency:
                description: OciConcurrency is the number of concurrent OCI operations
                  for the Zarf package.
                type: integer
              plainHTTP:
                description: PlainHTTP indicates whether to use plain HTTP instead
                  of HTTPS for the Zarf package.
                type: boolean
              registryCredentialSecretRef:
                description: |-
                  RegistryCredentialSecretRef is the name of a kubernetes.io/dockerconfigjson Secret
                  in the same namespace as the ZarfPackage. The controller reads the Secret's
                  .dockerconfigjson key and injects it as the Docker credential store for the
                  OCI pull, so the sidecar can authenticate to private registries.
                type: string
              retries:
                description: Retries is the number of times to retry deploying the
                  Zarf package in case of failure.
                type: integer
              set:
                description: Set is a list of key-value pairs as package variables.
                items:
                  type: string
                type: array
              shasum:
                description: Shasum is the SHA256 checksum of the Zarf package.
                type: string
              skipSignatureValidation:
                description: SkipSignatureValidation indicates whether to skip signature
                  validation for the Zarf package.
                type: boolean
              source:
                description: Source is the location of the Zarf package OCI
                type: string
              suspend:
                default: false
                description: |-
                  Suspend stops reconciliation for this ZarfPackage when set to true.
                  The controller will not perform any deploy, remove, or drift check operations.
                type: boolean
              syncPolicy:
                allOf:
                - enum:
                  - Ignore
                  - Detect
                  - Remediate
                - enum:
                  - Ignore
                  - Detect
                  - Remediate
                default: Ignore
                description: |-
                  SyncPolicy defines how the operator handles drift between desired and actual state.
                  Ignore: Do not check for drift (default)
                  Detect: Check for drift and report in status, but do not remediate
                  Remediate: Check for drift and automatically redeploy to fix it
                type: string
              timeout:
                description: Timeout is the maximum duration to wait for the Zarf
                  package deployment.
                type: string
              tmpdir:
                description: Tmpdir is the temporary directory for the Zarf package.
                type: string
              yolo:
                description: |-
                  Yolo enables YOLO mode - deploy without requiring 'zarf init'.
                  Images are pulled directly from upstream registries instead of the internal Zarf registry.
                  Only use in connected environments where upstream registries are accessible.
                type: boolean
              zarfCache:
                description: ZarfCache is the cache directory for the Zarf package.
                type: string
            required:
            - source
            type: object
          status:
            description: ZarfPackageStatus defines the observed state of ZarfPackage.
            properties:
              componentStatuses:
                description: ComponentStatuses tracks the status of each deployed
                  component
                items:
                  description: ComponentStatus tracks the status of a single deployed
                    component
                  properties:
                    installCharts:
                      description: InstalledCharts lists the Helm charts deployed
                        by this component
                      items:
                        description: InstalledChartStatus tracks a Helm chart installed
                          by a component
                        properties:
                          chartName:
                            description: ChartName is the name of the Helm release
                            type: string
                          namespace:
                            description: Namespace where the chart is installed
                            type: string
                          status:
                            description: Status of the chart (Succeeded, Failed)
                            type: string
                        required:
                        - chartName
                        - namespace
                        - status
                        type: object
                      type: array
                    name:
                      description: Name of the component
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the generation of the package
                        when this component was deployed
                      type: integer
                    status:
                      description: Status of the component (Succeeded, Failed, Deploying,
                        Removing)
                      type: string
                  required:
                  - name
                  - status
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployedGeneration:
                description: DeployedGeneration is the Zarf deployment generation
                type: integer
              deployedSpecHash:
                description: |-
                  DeployedSpecHash is the hash of deployment-affecting spec fields
                  Used to detect when a redeployment is needed (follows Flux's lastAttemptedConfigDigest pattern)
                type: string
              deployedVersion:
                description: DeployedVersion is the version of the deployed package
                type: string
              driftInfo:
                description: DriftInfo contains details about detected drift (when
                  SyncPolicy is Detect or Remedeiate)
                properties:
                  detected:
                    description: Detected indicates whether drift was detected
                    type: boolean
                  lastCheckTime:
                    description: LastCheckTime is when drift was last checked
                    format: date-time
                    type: string
                  message:
                    description: Message provides human-readable drift details
                    type: string
                  missingReleases:
                    description: MissingReleases lists Helm releases that should exist
                      but don't
                    items:
                      type: string
                    type: array
                required:
                - detected
                type: object
              failureCount:
                description: FailureCount tracks consecutive reconciliation failures
                  for backoff calculation.
                format: int32
                type: integer
              lastAttemptError:
                description: LastAttemptError is the most recent deployment error
                  message.
                type: string
              lastAttemptedRevision:
                description: LastAttemptedRevision is the source revision last attempted
                  by the controller.
                type: string
              lastFailureTime:
                description: LastFailureTime is when the last failure occurred.
                format: date-time
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the package was last reconciled
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation observed by the
                  controller
                format: int64
                type: integer
              packageName:
                description: PackageName is the name from the package metadata
                type: string
              phase:
                description: Phase is the current phase of the deployment
                enum:
                - Pending
                - Deploying
                - Deployed
                - Failed
                - Removing
                type: string
              source:
                description: Source is the resolved source of the package
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
