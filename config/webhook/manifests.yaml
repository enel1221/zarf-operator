---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ops-d0s-dev-v1alpha1-zarfpackage
  failurePolicy: Fail
  name: mzarfpackage-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ops.d0s.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - zarfpackages
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-ops-d0s-dev-v1alpha1-zarfpackage
  failurePolicy: Fail
  name: vzarfpackage-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ops.d0s.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - zarfpackages
  sideEffects: None
