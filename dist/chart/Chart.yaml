apiVersion: v2
name: zarf-operator
description: Kubernetes operator for deploying and managing Zarf packages
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/enel1221/zarf-operator
sources:
  - https://github.com/enel1221/zarf-operator
maintainers:
  - name: enel1221
keywords:
  - zarf
  - kubernetes
  - operator
  - airgap
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Seamless Upgrades
  artifacthub.io/prerelease: "true"
  artifacthub.io/crds: |
    - kind: ZarfPackage
      version: v1alpha1
      name: zarfpackage
      displayName: Zarf Package
      description: Declarative Zarf package deployment
