name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  release-metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
    steps:
      - name: Resolve version and release channel
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Invalid tag format: ${TAG}. Expected vX.Y.Z"
              exit 1
            fi

            VERSION="${TAG#v}"
            MAJOR="${VERSION%%.*}"
            if (( MAJOR < 1 )); then
              IS_PRERELEASE=true
              RELEASE_CHANNEL=alpha
            else
              IS_PRERELEASE=false
              RELEASE_CHANNEL=stable
            fi

            IMAGE_TAG="${TAG}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
            IMAGE_TAG="${GITHUB_SHA::7}"
            IS_PRERELEASE=true
            RELEASE_CHANNEL=snapshot
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_channel=${RELEASE_CHANNEL}" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linter
        run: golangci-lint run

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go mod tidy
          make test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster

      - name: Run E2E tests
        run: |
          go mod tidy
          make test-e2e

  test-chart:
    name: Test Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster

      - name: Build and load image
        run: |
          go mod tidy
          make docker-build IMG=zarf-operator:v0.1.0
          kind load docker-image zarf-operator:v0.1.0

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Lint Helm chart
        run: helm lint ./dist/chart

      - name: Install Helm chart
        run: |
          helm install my-release ./dist/chart --create-namespace --namespace zarf-operator-system

      - name: Check Helm release status
        run: helm status my-release --namespace zarf-operator-system

  build-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [release-metadata, lint, test, test-e2e, test-chart]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manager
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enel1221/zarf-operator
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata for sidecar
        id: meta-sidecar
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enel1221/zarf-operator-sidecar
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push manager image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/enel1221/zarf-operator:buildcache
          cache-to: type=registry,ref=ghcr.io/enel1221/zarf-operator:buildcache,mode=max

      - name: Build and push sidecar image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-sidecar.outputs.tags }}
          labels: ${{ steps.meta-sidecar.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/enel1221/zarf-operator-sidecar:buildcache
          cache-to: type=registry,ref=ghcr.io/enel1221/zarf-operator-sidecar:buildcache,mode=max

  build-helm:
    name: Build and Push Helm Chart
    runs-on: ubuntu-latest
    needs: [release-metadata, build-images]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Log in to Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update chart version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.release-metadata.outputs.version }}/" dist/chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.release-metadata.outputs.version }}\"/" dist/chart/Chart.yaml

      - name: Set chart prerelease annotation
        run: |
          sed -i "s|^  artifacthub.io/prerelease:.*|  artifacthub.io/prerelease: \"${{ needs.release-metadata.outputs.is_prerelease }}\"|" dist/chart/Chart.yaml

      - name: Lint Helm chart
        run: helm lint ./dist/chart

      - name: Package Helm chart
        run: helm package dist/chart --destination dist --version ${{ needs.release-metadata.outputs.version }}

      - name: Push Helm chart to OCI registry
        run: helm push dist/zarf-operator-${{ needs.release-metadata.outputs.version }}.tgz oci://ghcr.io/enel1221/charts

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ needs.release-metadata.outputs.version }}
          path: dist/zarf-operator-${{ needs.release-metadata.outputs.version }}.tgz
          if-no-files-found: error

  build-zarf:
    name: Build and Push Zarf Package
    runs-on: ubuntu-latest
    needs: [release-metadata, build-images, build-helm]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zarf
        uses: defenseunicorns/setup-zarf@main
        with:
          version: v0.42.2

      - name: Log in to Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | zarf tools registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Zarf package (amd64)
        run: |
          cd dist
          zarf package create . --confirm --output . \
            --architecture amd64 \
            --set VERSION=${{ needs.release-metadata.outputs.version }} \
            --set OPERATOR_IMAGE=ghcr.io/enel1221/zarf-operator \
            --set OPERATOR_IMAGE_TAG=${{ needs.release-metadata.outputs.image_tag }} \
            --set SIDECAR_IMAGE=ghcr.io/enel1221/zarf-operator-sidecar \
            --set SIDECAR_IMAGE_TAG=${{ needs.release-metadata.outputs.image_tag }}

      - name: Build Zarf package (arm64)
        run: |
          cd dist
          zarf package create . --confirm --output . \
            --architecture arm64 \
            --set VERSION=${{ needs.release-metadata.outputs.version }} \
            --set OPERATOR_IMAGE=ghcr.io/enel1221/zarf-operator \
            --set OPERATOR_IMAGE_TAG=${{ needs.release-metadata.outputs.image_tag }} \
            --set SIDECAR_IMAGE=ghcr.io/enel1221/zarf-operator-sidecar \
            --set SIDECAR_IMAGE_TAG=${{ needs.release-metadata.outputs.image_tag }}

      - name: Publish Zarf packages
        run: |
          cd dist
          for pkg in zarf-package-zarf-operator-*.tar.zst; do
            zarf package publish "$pkg" oci://ghcr.io/enel1221/packages
          done

      - name: Upload Zarf package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zarf-packages-${{ needs.release-metadata.outputs.version }}
          path: dist/zarf-package-zarf-operator-*.tar.zst
          if-no-files-found: error

  build-install-bundle:
    name: Build Install Bundle
    runs-on: ubuntu-latest
    needs: [release-metadata, build-images]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build install manifest bundle
        run: |
          make build-installer \
            VERSION=${{ needs.release-metadata.outputs.version }} \
            IMG=ghcr.io/enel1221/zarf-operator:${{ needs.release-metadata.outputs.image_tag }} \
            SIDECAR_IMG=ghcr.io/enel1221/zarf-operator-sidecar:${{ needs.release-metadata.outputs.image_tag }}

      - name: Upload install bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-bundle-${{ needs.release-metadata.outputs.version }}
          path: dist/install.yaml
          if-no-files-found: error

